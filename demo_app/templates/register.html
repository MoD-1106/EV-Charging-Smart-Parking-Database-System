{% extends "base.html" %}
{% block title %}Đăng ký · EV Charge M3B{% endblock %}
{% block body %}
<div class="login wide panel">
  <h3 style="margin-bottom:14px">Đăng ký khách hàng</h3>
  <form method="post" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label for="name">Họ tên</label><input id="name" name="name" required maxlength="100" value="{{ form.get('name', '') }}" autofocus autocomplete="name"></div>
    <div class="row">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="255" value="{{ form.get('email', '') }}" autocomplete="email"></div>
      <div class="field"><label for="phone">Số điện thoại</label><input id="phone" name="phone" required pattern="\+?[0-9]{8,14}" value="{{ form.get('phone', '') }}" autocomplete="tel"></div>
    </div>
    <div class="row">
      <div class="field"><label for="password">Mật khẩu (tối thiểu 8 ký tự)</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></div>
      <div class="field"><label for="password2">Nhập lại mật khẩu</label><input id="password2" name="password2" type="password" required minlength="8" autocomplete="new-password"></div>
    </div>
    <h2 style="margin:6px 0 10px">Xe của bạn</h2>
    <div class="row">
      <div class="field"><label for="plate">Biển số</label><input id="plate" name="plate" required maxlength="20" value="{{ form.get('plate', '') }}"></div>
      <div class="field"><label for="battery">Dung lượng pin (kWh)</label><input id="battery" name="battery" required inputmode="decimal" pattern="[0-9]+([.,][0-9]{1,2})?" value="{{ form.get('battery', '') }}"></div>
    </div>
    <button class="btn" style="width:100%" type="submit">Tạo tài khoản</button>
  </form>
  <p class="muted small" style="margin-top:12px">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
</div>
{% endblock %}
