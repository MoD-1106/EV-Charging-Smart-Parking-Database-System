<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EV Charge M3B{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
{% if user %}
<header class="top">
  <b>EV Charge M3B</b>
  <div class="who"><span>{{ user }}</span><span class="pill p-mute">{{ role }}</span>
    <form method="post" action="{{ url_for('logout') }}" style="margin:0"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn ghost sm" type="submit">Đăng xuất</button></form></div>
</header>
{% endif %}
{% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}" role="status">{{ m }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</div>
<div id="clock" class="clock" role="timer" aria-label="Đồng hồ hệ thống" data-tz="{{ tz }}" data-api="{{ url_for('api_time') }}">
  <span class="clock-time mono" id="clock-time">--:--:--</span>
  <span class="clock-date" id="clock-date">&nbsp;</span>
  <span class="pill" id="clock-band" hidden></span>
  <span class="clock-next" id="clock-next" hidden></span>
</div>
<script src="{{ url_for('static', filename='live.js') }}"></script>
</body>
</html>
