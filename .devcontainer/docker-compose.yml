services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    command: sleep infinity
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename:-workspace}:cached
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evt
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chạy tự động một lần khi volume trống: schema rồi dữ liệu mẫu
      - ../schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evt"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
